<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Atelier Terminal</title>
<link rel="stylesheet" href="/xterm.css" />
<style>
  html, body { margin: 0; padding: 0; height: 100%; width: 100%; background: #1f1a14; overflow: hidden; }
  #host { position: absolute; inset: 0; padding: 8px 12px; box-sizing: border-box; }
  #host .xterm { height: 100%; }
  #host .xterm-viewport { background: transparent !important; }
  #status { position: absolute; top: 4px; right: 8px; font: 10px ui-monospace, monospace; color: #d9a066; opacity: 0.7; pointer-events: none; }
</style>
</head>
<body>
  <div id="host"></div>
  <div id="status">connecting…</div>
  <!-- Local bundle (xterm + FitAddon → window.AtelierXterm). Built by:
       bun build src/_term-vendor.ts --target=browser --format=iife --minify
                  --outfile=public/xterm-bundle.js
       Bundling locally instead of CDN avoids: (a) CORS preflight failures
       under Playwright's extraHTTPHeaders, (b) external network dependency
       at run time, (c) version drift if jsdelivr changes. -->
  <script src="/xterm-bundle.js"></script>
  <script>
    (function () {
      var XtermTerminal = window.AtelierXterm.Terminal;
      var FitAddon = window.AtelierXterm.FitAddon;

      var params = new URLSearchParams(location.search);
      var sid = params.get("sid") || (Math.random().toString(36).slice(2) + Date.now().toString(36));
      var provider = params.get("provider") || "claude";
      var wsUrl = params.get("ws");
      var statusEl = document.getElementById("status");
      var setStatus = function (t) { statusEl.textContent = t; };

      var term = new XtermTerminal({
        fontFamily: "'JetBrains Mono','Cascadia Mono','SF Mono','IBM Plex Mono',Menlo,Consolas,monospace",
        fontSize: 13,
        lineHeight: 1.35,
        theme: { background: "#1f1a14", foreground: "#e8ddc9", cursor: "#d9a066", selectionBackground: "#544a38" },
        cursorBlink: true,
        cursorStyle: "bar",
        cursorWidth: 2,
        convertEol: true,
        scrollback: 10000,
        allowProposedApi: true,
      });
      var fit = new FitAddon();
      term.loadAddon(fit);
      term.open(document.getElementById("host"));

      // Coalesce all fits/resizes through a single rAF + 80 ms debounce so
      // boot-time layout flushes (font load, ResizeObserver flutter, parent
      // iframe sizing) collapse into ONE PTY resize. Sending raw resize per
      // event makes qwen-code's TUI redraw its input box at every width and
      // those redraws stack on screen.
      var lastCols = 0, lastRows = 0;
      var rafId = 0, debounceId = 0;
      var doRefit = function () {
        try { fit.fit(); } catch (e) {}
        if (term.cols === lastCols && term.rows === lastRows) return;
        lastCols = term.cols;
        lastRows = term.rows;
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: "resize", cols: term.cols, rows: term.rows }));
        }
      };
      var scheduleRefit = function () {
        if (debounceId) clearTimeout(debounceId);
        debounceId = setTimeout(function () {
          if (rafId) cancelAnimationFrame(rafId);
          rafId = requestAnimationFrame(doRefit);
        }, 80);
      };
      requestAnimationFrame(function () { requestAnimationFrame(scheduleRefit); });

      var wsTarget = wsUrl || ((location.protocol === "https:" ? "wss:" : "ws:") + "//" + location.host + "/ws");
      var ws = new WebSocket(wsTarget + "?session=" + encodeURIComponent(sid) + "&provider=" + encodeURIComponent(provider));
      ws.onopen = function () {
        setStatus("connected");
        ws.send(JSON.stringify({ type: "resize", cols: term.cols, rows: term.rows }));
        term.focus();
      };
      ws.onclose = function (e) { setStatus("closed " + e.code); };
      ws.onerror = function () { setStatus("error"); };
      ws.onmessage = function (e) {
        var msg = null;
        try { msg = JSON.parse(typeof e.data === "string" ? e.data : ""); } catch (err) {}
        if (!msg) return;
        if (msg.type === "agent.data" && typeof msg.chunk === "string") term.write(msg.chunk);
        else if (msg.type === "session.ready") setStatus("ready");
        else if (msg.type === "session.closed") {
          term.write("\r\n\x1b[33m[atelier] session closed (code " + (msg.code != null ? msg.code : "?") + ")\x1b[0m\r\n");
          setStatus("closed");
        } else if (msg.type === "error") {
          term.write("\r\n\x1b[31m[atelier] " + (msg.error || "error") + "\x1b[0m\r\n");
        }
      };

      term.onData(function (data) {
        if (ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: "raw", data: data }));
      });

      window.addEventListener("resize", scheduleRefit);
      new ResizeObserver(scheduleRefit).observe(document.getElementById("host"));

      var post = function (type, payload) {
        try { window.parent && window.parent.postMessage({ source: "atelier-terminal", sid: sid, type: type, payload: payload }, "*"); } catch (e) {}
      };
      ws.addEventListener("open", function () { post("status", "connected"); });
      ws.addEventListener("close", function (e) { post("status", "closed:" + e.code); });
      ws.addEventListener("message", function (e) {
        try {
          var m = JSON.parse(e.data);
          if (m.type === "session.ready") post("status", "ready");
        } catch (err) {}
      });

      window.addEventListener("message", function (e) {
        var m = e.data;
        if (!m || m.target !== "atelier-terminal") return;
        if (m.cmd === "focus") term.focus();
        if (m.cmd === "paste" && typeof m.text === "string") term.paste(m.text);
        if (m.cmd === "kill") ws.close();
      });
    })();
  </script>
</body>
</html>
